{% extends "auth/auth_base.html" %}
{% block content %}<div class="auth-icon"><i class="bi bi-envelope-arrow-up"></i></div><h1>Reenviar verificación</h1><p>Ingresa el correo de tu cuenta. Si está pendiente de verificación, enviaremos un enlace nuevo.</p><form method="post" class="auth-form">{% csrf_token %}<label for="id_email">Correo electrónico</label><input class="form-control form-control-lg" id="id_email" name="email" type="email" required autocomplete="email" value="{{ form.email.value|default:'' }}" placeholder="tu.correo@email.com">{% if form.email.errors %}<small class="auth-field-error">{{ form.email.errors.0 }}</small>{% endif %}<button class="btn btn-primary btn-lg" type="submit">Reenviar enlace</button></form><a class="auth-back" href="{% url 'index' %}"><i class="bi bi-arrow-left"></i> Volver al inicio de sesión</a>{% endblock %}
