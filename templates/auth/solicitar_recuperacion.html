{% extends "auth/auth_base.html" %}
{% block content %}<div class="auth-icon"><i class="bi bi-envelope"></i></div><h1>Recupera tu acceso</h1><p>Escribe el correo asociado a tu cuenta. Si existe, enviaremos un enlace seguro para crear una nueva contraseña.</p><form method="post" class="auth-form">{% csrf_token %}<label for="recoveryEmail">Correo electrónico</label><input class="form-control form-control-lg" id="recoveryEmail" name="email" type="email" required autocomplete="email" placeholder="tu.correo@email.com"><button class="btn btn-primary btn-lg" type="submit">Enviar enlace de recuperación</button></form><a class="auth-back" href="{% url 'index' %}"><i class="bi bi-arrow-left"></i> Volver al inicio de sesión</a>{% endblock %}
